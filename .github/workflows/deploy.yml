name: Deploy redirect to GitHub Pages

# 2026-11-18 サイト本体は Cloudflare Pages (https://kaso-kobo.com) へ移転。
# GitHub Pages 側は旧URLからの訪問者を新ドメインへ飛ばすページ (github-redirect/) だけを公開する。

on:
  push:
    branches: ["main"]
    paths:
      - "github-redirect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
